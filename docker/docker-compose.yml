services:

  postgres:
    image: postgres:17
    container_name: cloud-storage-db

    ports:
    - "5432:5432"

    environment:
      POSTGRES_DB: cloud_storage
      POSTGRES_USER: iii
      POSTGRES_PASSWORD: 2367

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iii -d cloud_storage"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d


  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: cloud-storage-app

    depends_on:
      - postgres

    env_file:
      - .env

    ports:
      - "8080:8080"


volumes:
  postgres_data:
