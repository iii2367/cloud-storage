<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Auth Test</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f5f6fa;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 15px;
    }

    h1 {
        text-align: center;
    }

    .box {
        background: white;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }

    h3 {
        margin-top: 0;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        padding: 10px 18px;
        margin-top: 8px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background: #2563eb;
        color: white;
    }

    button:hover {
        background: #1d4ed8;
    }

    .danger {
        background: #dc2626;
    }

    .danger:hover {
        background: #b91c1c;
    }

    .token {
        font-size: 12px;
        color: #555;
        word-break: break-all;
    }

    pre {
        background: #111827;
        color: #e5e7eb;
        padding: 15px;
        border-radius: 8px;
        overflow-x: auto;
    }

    .status {
        padding: 10px;
        background: #e0f2fe;
        border-radius: 5px;
        margin-bottom: 15px;
    }
</style>

</head>

<body>

<h1>Auth Test</h1>

<div class="status">
    Access token:
    <div class="token" id="token">
        empty
    </div>
</div>


<div class="box">

<h3>Signup</h3>

<input id="signup-name" placeholder="Name">
<input id="signup-email" placeholder="Email">
<input id="signup-password" placeholder="Password" type="password">

<button onclick="signup()">Signup</button>

</div>


<div class="box">

<h3>Login</h3>

<input id="login-email" placeholder="Email">
<input id="login-password" placeholder="Password" type="password">

<button onclick="login()">Login</button>

</div>


<div class="box">

<h3>User</h3>

<button onclick="getMe()">GET /users/me</button>
            <br>
<button onclick="deleteMe()">DELETE /users/me</button>

</div>


<div class="box">

<h3>Tokens</h3>

<button onclick="refresh()">Refresh token</button>

<button onclick="logout()" class="danger">
Logout
</button>

</div>


<div class="box">

<h3>Response</h3>

<pre id="result">
waiting...
</pre>

</div>


<script>

let accessToken = "";


function show(data) {
    document.getElementById("result").textContent =
        JSON.stringify(data, null, 2);
}


function updateToken() {
    document.getElementById("token").textContent =
        accessToken || "empty";
}


async function parseResponse(response) {

    const text = await response.text();

    try {
        return JSON.parse(text);
    }
    catch {
        return text;
    }
}


async function signup() {

    const response = await fetch("/auth/signup", {
        method: "POST",
        credentials: "include",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            name:
            document.getElementById("signup-name").value,

            email:
            document.getElementById("signup-email").value,

            password:
            document.getElementById("signup-password").value
        })
    });


    show({
        status: response.status,
        response: await parseResponse(response)
    });
}



async function login() {

    const response = await fetch("/auth/login", {
        method:"POST",
        credentials:"include",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({

            email:
            document.getElementById("login-email").value,

            password:
            document.getElementById("login-password").value
        })
    });


    const data = await parseResponse(response);


    if(response.ok){
        accessToken = data.access_token;
        updateToken();
    }


    show({
        status:response.status,
        response:data
    });
}



async function getMe(){

    const response = await fetch("/users/me", {

        method:"GET",

        credentials:"include",

        headers:{
            "Authorization":
            "Bearer " + accessToken
        }
    });


    show({
        status:response.status,
        response:await parseResponse(response)
    });
}

async function deleteMe(){

    const response = await fetch("/users/me", {

        method:"DELETE",

        credentials:"include",

        headers:{
            "Authorization":
            "Bearer " + accessToken
        }
    });


    show({
        status:response.status,
        response:await parseResponse(response)
    });
}



async function refresh(){

    const response = await fetch("/auth/refresh", {

        method:"POST",

        credentials:"include"
    });


    const data = await parseResponse(response);


    if(response.ok){

        accessToken = data.access_token;

        updateToken();
    }


    show({
        status:response.status,
        response:data
    });
}



async function logout(){

    const response = await fetch("/auth/logout", {

        method:"POST",

        credentials:"include"
    });


    const data = await parseResponse(response);


    accessToken = "";

    updateToken();


    show({
        status:response.status,
        response:data
    });
}


</script>


</body>
</html>
