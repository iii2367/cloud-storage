<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>{{ .Title }}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

        <link rel="stylesheet" href="/css/storage.css">
        <link rel="stylesheet" href="/css/main.css">

    </head>
    <body>
        <header class="topbar">

            <h2>{{ .Title }}</h2>

            <div class="account">
                <button class="account-btn" onclick="toggleMenu()">👤 My Account</button>

                <div class="account-menu" id="accountMenu">

                    <h3>Account</h3>

                    <div class="info">
                        <span>Name</span>
                        <strong class="user-name"></strong>
                    </div>

                    <div class="info">
                        <span>Email</span>
                        <strong class="user-email"></strong>
                    </div>

                    <div class="info">
                        <span>Created</span>
                        <strong class="user-created"></strong>
                    </div>

                    <div class="buttons">
                        <button 
                            onclick="logout()" 
                            class="logout-btn">
                            Logout
                        </button>

                        <button 
                            onclick="deleteAccount()"  
                            class="danger">
                            Delete
                        </button>
                    </div>
                </div>
            </div>
        </header>
        
        <div class="box manager">
            
            <div class="toolbar">

                <button onclick="openFolderModal()">+ Folder</button>
    
                <button onclick="openUploadModal()">+ Upload</button>

                <button>Back</button>

            </div>

            <div class="path">
                Path: /
            </div>
            
            <div class="files">
                <div class="item folder">
                    📁
                    <span>Photos</span>
               </div>

                <div class="item folder">
                    📁
                    <span>Music</span>
                </div>

                <div class="item file">
                    📄
                    <span>notes.txt</span>
                </div>

                <div class="item file">
                    📄
                    <span>report.pdf</span>
                </div>

            </div>
        </div>

        <div class="modal" id="folderModal">

            <div class="modal-window">

                <h3>Create Folder</h3>

                <input
                    id="folder-name"
                    type="text"
                    placeholder="Name"
                >

                <textarea
                    id="folder-description"
                    placeholder="Description"
                ></textarea>

                <div class="buttons">
                    <button>Create</button>
                    <button onclick="closeFolderModal()">Close</button>
                </div> 
            </div>
        </div>
        <div class="modal" id="uploadModal">

            <div class="modal-window">

                <h3>Upload File</h3>

                 <input
                    id="file-name"
                    type="text"
                    placeholder="Name"
                >

                <textarea
                    id="upload-description"
                    placeholder="Description"
                ></textarea>

                <input
                     id="upload-file"
                    type="file"
                    hidden
                >
                <label
                    id="filePicker"
                    for="upload-file"
                    class="file-picker"
                >
                    📄 Select File
                </label> 

                <div class="buttons">
                    <button>Save</button>
                    <button onclick="closeUploadModal()">Close</button>
                </div> 
            </div>
        </div>
        <script src="/js/storage.js"></script>
    </body>
</html>
