<style>
.topbar{

    width:100%;
    height:70px;

    position:fixed;

    top:0;
    left:0;

    padding:0 30px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:#2b2d31;

    border-bottom:2px solid #4fd1c5;

    box-shadow:0 4px 15px rgba(0,0,0,.35);

}

.topbar h2{

    color:#c4fff4;
    margin:0;

}

.account{

    position:relative;

}

.account-btn{

    background:#4fd1c5;
    color:#202225;

    border:none;

    padding:10px 16px;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;

}

.account-menu{

    position:absolute;

    right:0;
    top:55px;

    width:260px;

    background:#2b2d31;

    border:2px solid #4fd1c5;

    border-radius:12px;

    display:none;

    padding:20px;

    box-shadow:0 10px 30px rgba(0,0,0,.4);

}

.account-menu.show{

    display:block;

}

.account-menu h3{

    color:#c4fff4;

    margin-top:0;

}

.info{

    margin-bottom:18px;

}

.info span{

    display:block;

    color:#8fa9a5;

    font-size:13px;

}

.info strong{

    color:white;

}

.logout-btn{

    width:100%;
}

.manager{

    margin-top:110px;

    max-width:900px;

}

.toolbar{

    display:flex;

    gap:12px;

    margin-bottom:20px;

}

.path{

    color:#8fa9a5;

    margin-bottom:20px;

}

.files{

    display:grid;

    grid-template-columns:repeat(auto-fill,minmax(110px,1fr));

    gap:15px;

}

.item{

    background:#202225;

    border:2px solid #4fd1c5;

    border-radius:12px;

    height:110px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    color:#c4fff4;

    cursor:pointer;

    transition:.2s;

}

.item:hover{

    transform:translateY(-3px);

    box-shadow:0 0 15px rgba(0,255,224,.3);

}

.item span{

    margin-top:10px;

    font-size:14px;

}



* {
    box-sizing: border-box;
}


body {
    font-family: Arial, sans-serif;
    background: #202225;

    min-height: 100vh;
    margin: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}



.box {

    width: 100%;
    max-width: 420px;

    background: #2b2d31;

    border: 2px solid #4fd1c5;

    border-radius: 16px;

    padding: 30px 25px;

    text-align: center;

    box-shadow:
        0 10px 30px rgba(0,0,0,.35);

    animation: show .3s ease;
}



@keyframes show {

    from {
        opacity: 0;
        transform: translateY(15px);
    }


    to {
        opacity: 1;
        transform: translateY(0);
    }

}



h2 {

    color: #c4fff4;

    margin: 0 0 25px;

    font-size: 28px;

}



input {

    display: block;

    width: 100%;

    height: 45px;


    background: #202225;

    color: #c4fff4;


    font-size: 17px;


    border: 2px solid #4fd1c5;

    border-radius: 10px;


    padding: 0 15px;

    margin: 12px 0;


    outline: none;

    text-align: center;


    transition:
        border-color .3s,
        box-shadow .3s,
        transform .2s;

}



input::placeholder {

    color: #8fa9a5;

}



input:focus {

    border-color: #00ffe0;


    box-shadow:
        0 0 10px rgba(0,255,224,.4);


    transform: scale(1.02);

}



.buttons {

    display: flex;

    gap: 12px;

    justify-content: center;


    margin-top: 20px;

}



button {

    flex: 1;

    height: 42px;


    background: #4fd1c5;

    color: #202225;


    border: none;

    border-radius: 10px;


    font-size: 16px;

    font-weight: bold;


    cursor: pointer;


    transition:

        background .3s,

        transform .2s,

        box-shadow .3s;

}



button:hover {

    background: #00ffe0;


    transform: translateY(-2px);


    box-shadow:

        0 5px 15px rgba(0,255,224,.3);

}



button:active {

    transform: scale(.96);

}



@media (max-width:400px) {

    .buttons {

        flex-direction: column;

    }

}

</style>
<script>function toggleMenu() {

    document
        .getElementById("accountMenu")
        .classList
        .toggle("show");

}

window.onclick = function(e){

    if(!e.target.closest(".account")){

        document
            .getElementById("accountMenu")
            .classList
            .remove("show");

    }

}</script>
<header class="topbar">

    <h2>Cloud Storage</h2>

    <div class="account">
        <button class="account-btn" onclick="toggleMenu()">
            👤 My Account
        </button>

        <div class="account-menu" id="accountMenu">

            <h3>Account</h3>

            <div class="info">
                <span>Name</span>
                <strong>TestName</strong>
            </div>

            <div class="info">
                <span>Email</span>
                <strong>test@mail.com</strong>
            </div>

            <div class="info">
                <span>Created</span>
                <strong>2026-07-15</strong>
            </div>

            <button class="logout-btn">
                Logout
            </button>

        </div>
    </div>
</header>

<div class="box manager">

    <div class="toolbar">

        <button>+ Folder</button>

        <button>+ Upload</button>

        <button>Back</button>

    </div>

    <div class="path">
        Path: /
    </div>

    <div class="files">

        <div class="item folder">
            📁
            <span>Photos</span>
        </div>

        <div class="item folder">
            📁
            <span>Music</span>
        </div>

        <div class="item file">
            📄
            <span>notes.txt</span>
        </div>

        <div class="item file">
            📄
            <span>report.pdf</span>
        </div>

    </div>

</div>
