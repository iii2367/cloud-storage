<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>{{ .Title }}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
        
        <link rel="stylesheet" href="/css/main.css">
        <script src="/js/auth.js"></script>
    </head>
    <body>

        <div class="box">

            <h2>{{ .TitleBox }}</h2>

            <input
                id="signup-name"
                type="text"
                placeholder="Name"
            >

            <input
                id="signup-email"
                type="email"
                placeholder="Email"
            >

            <input
                id="signup-password"
                type="password"
                placeholder="Password"
            >

            <div class="buttons">
                <button onclick="signup()">Create Account</button>
                <button onclick="window.location.href='/'">Already have an account</button>
            </div>
        </div>
    </body>
</html>
